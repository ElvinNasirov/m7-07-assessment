service: retail-recommendations
description: >-
  SLOs for the Scenario X synchronous home-screen recommendation path.
  Objectives are internal targets used to drive burn-rate alerting.

slos:
  - name: availability
    objective: 0.997
    window: 30d
    description: Fraction of sync requests served without a 5xx, rolling 30 days.
    sli:
      type: ratio
      good: 'count(http_requests_total{service="retail-recommendations",route="/v1/recommendations",code!~"5.."})'
      total: 'count(http_requests_total{service="retail-recommendations",route="/v1/recommendations"})'

  - name: latency_p95
    objective: 0.95
    threshold_ms: 120
    window: 30d
    description: 95% of successful sync requests complete end-to-end within 120 ms.
    sli:
      type: ratio
      good: 'count(http_request_duration_ms_bucket{service="retail-recommendations",route="/v1/recommendations",code="200",le="120"})'
      total: 'count(http_request_duration_ms_count{service="retail-recommendations",route="/v1/recommendations",code="200"})'

  - name: latency_p99
    objective: 0.99
    threshold_ms: 250
    window: 30d
    description: 99% of successful sync requests complete end-to-end within 250 ms.
    sli:
      type: ratio
      good: 'count(http_request_duration_ms_bucket{service="retail-recommendations",route="/v1/recommendations",code="200",le="250"})'
      total: 'count(http_request_duration_ms_count{service="retail-recommendations",route="/v1/recommendations",code="200"})'

  - name: recommendation_freshness
    objective: 0.99
    threshold_minutes: 15
    window: 30d
    description: 99% of served responses use feature snapshots no older than 15 minutes.
    sli:
      type: ratio
      good: 'count(feature_snapshot_age_minutes_bucket{service="retail-recommendations",le="15"})'
      total: 'count(feature_snapshot_age_minutes_count{service="retail-recommendations"})'

burn_rate_alerts:
  - name: fast
    purpose: page
    burn_rate: 14.4
    long_window: 1h
    short_window: 5m
  - name: slow
    purpose: ticket
    burn_rate: 6
    long_window: 6h
    short_window: 30m
  - name: slow_24h
    purpose: ticket
    burn_rate: 6
    long_window: 24h
    short_window: 2h
